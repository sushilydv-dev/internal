services:
  - type: web
    name: resume-screener
    runtime: docker   # Dockerfile installs Chrome + a virtual screen for the Indeed download
    plan: starter
    healthCheckPath: /
    envVars:
      - key: FETCH_TABS
        value: "2"   # parallel Chrome tabs; raise to 4 on a bigger plan
      - key: ZOHO_DOMAIN
        value: com
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: WORKDRIVE_ROOT_FOLDER_ID
        sync: false
      - key: EMAIL_ADDRESS
        value: helios.cvtechlabs@gmail.com
      - key: EMAIL_APP_PASSWORD
        sync: false
      # With a Render persistent disk mounted at /var/data, uncomment so the history
      # (screenings, fetched emails) survives redeploys:
      # - key: DATABASE_PATH
      #   value: /var/data/screener.db
