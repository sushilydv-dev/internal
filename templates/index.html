<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Resume Screener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></svg>
        </span>
        <span><b>Resume Screener</b></span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="#/dashboard" data-nav="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h6V3H3zM15 21h6V11h-6zM3 21h6v-5H3zM15 8h6V3h-6z"/></svg>
          Dashboard
        </a>
        <a href="#/" data-nav="screen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Resumes
        </a>
        <a href="#/candidates" data-nav="candidates">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Candidates
        </a>
        <a href="#/log" data-nav="log">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>
          Activity log
        </a>
      </nav>

      <div class="sys" id="status" aria-live="polite"></div>
    </aside>

    <div class="main">
      <div id="banner" class="banner-stack"></div>
      <main id="view" class="view" tabindex="-1">
        <div class="loading-block"><span class="spinner"></span> Loading…</div>
      </main>
    </div>
  </div>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-scrim" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div id="drawer-body"></div>
    </section>
  </aside>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-scrim" data-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true" id="modal-body"></section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
